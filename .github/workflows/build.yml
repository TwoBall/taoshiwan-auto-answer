name: Build and Release Windows Executable

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Windows Application
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build executable with PyInstaller
        shell: bash
        run: |
          pyinstaller --noconfirm --clean \
            --onefile \
            --windowed \
            --name="暴打淘师湾" \
            --add-data "questions.db;." \
            --add-data "config.py;." \
            --hidden-import="selenium" \
            --hidden-import="selenium.webdriver" \
            --hidden-import="selenium.webdriver.chrome.service" \
            --hidden-import="PyQt5" \
            --hidden-import="PyQt5.QtCore" \
            --hidden-import="PyQt5.QtWidgets" \
            --hidden-import="PyQt5.QtGui" \
            --hidden-import="psutil" \
            --hidden-import="bs4" \
            --exclude-module="PyQt5.Qt" \
            main.py

      - name: Prepare Release Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist/release
          Copy-Item "dist/暴打淘师湾.exe" -Destination "dist/release/"
          Copy-Item "questions.db" -Destination "dist/release/"
          Copy-Item "README.md" -Destination "dist/release/"
          Copy-Item "config.py" -Destination "dist/release/"
          Compress-Archive -Path "dist/release/*" -DestinationPath "dist/taoshiwan-auto-answer-windows.zip" -Force

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v6
        with:
          name: taoshiwan-auto-answer-windows
          path: |
            dist/暴打淘师湾.exe
            dist/taoshiwan-auto-answer-windows.zip
          retention-days: 30

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/暴打淘师湾.exe
            dist/taoshiwan-auto-answer-windows.zip
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
