name: Build and Release Windows Executable

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Windows Application
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build executable with PyInstaller
        shell: bash
        run: |
          pyinstaller --noconfirm --clean \
            --onefile \
            --windowed \
            --name="taoshiwan-auto-answer" \
            --icon="assets/app_icon.ico" \
            --add-data "questions.db;." \
            --add-data "config.py;." \
            --add-data "browser_manager.py;." \
            --add-data "styles.py;." \
            --add-data "log_widget.py;." \
            --add-data "assets;assets" \
            --hidden-import="selenium" \
            --hidden-import="selenium.webdriver" \
            --hidden-import="selenium.webdriver.chrome.service" \
            --hidden-import="selenium.webdriver.chrome.options" \
            --hidden-import="selenium.webdriver.edge.service" \
            --hidden-import="selenium.webdriver.edge.options" \
            --hidden-import="browser_manager" \
            --hidden-import="styles" \
            --hidden-import="log_widget" \
            --hidden-import="PyQt5" \
            --hidden-import="PyQt5.QtCore" \
            --hidden-import="PyQt5.QtWidgets" \
            --hidden-import="PyQt5.QtGui" \
            --hidden-import="PyQt5.QtSvg" \
            --hidden-import="PIL" \
            --hidden-import="PIL.Image" \
            --hidden-import="psutil" \
            --hidden-import="bs4" \
            --exclude-module="PyQt5.Qt" \
            main.py

      - name: Prepare Release Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist/release
          Copy-Item "dist/taoshiwan-auto-answer.exe" -Destination "dist/release/暴打淘师湾.exe"
          Copy-Item "dist/taoshiwan-auto-answer.exe" -Destination "dist/release/taoshiwan-auto-answer.exe"
          Copy-Item "questions.db" -Destination "dist/release/"
          Copy-Item "README.md" -Destination "dist/release/"
          Copy-Item "config.py" -Destination "dist/release/"
          Copy-Item "browser_manager.py" -Destination "dist/release/"
          Copy-Item "styles.py" -Destination "dist/release/"
          Copy-Item "log_widget.py" -Destination "dist/release/"
          if (Test-Path "assets") {
            Copy-Item -Recurse -Force "assets" -Destination "dist/release/assets"
          }
          Compress-Archive -Path "dist/release/*" -DestinationPath "dist/taoshiwan-auto-answer-windows.zip" -Force

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v6
        with:
          name: taoshiwan-auto-answer-windows
          path: |
            dist/taoshiwan-auto-answer.exe
            dist/taoshiwan-auto-answer-windows.zip
          retention-days: 30

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/taoshiwan-auto-answer.exe
            dist/taoshiwan-auto-answer-windows.zip
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
